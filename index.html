<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⏱️ OT Pro - Premium V3.2</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --ios-red: #FF3B30; --ios-green: #34C759; --ios-blue: #007AFF; 
            --ios-orange: #FF9500; --ios-bg: #F2F2F7; --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--ios-bg); color: #1C1C1E; 
            padding-bottom: calc(60px + env(safe-area-inset-bottom)); 
            letter-spacing: -0.01em;
        }
        
        /* Đăng nhập */
        #authScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #F2F2F7 0%, #E5E5EA 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 380px; padding: 40px 30px; border-radius: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .auth-input { width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 16px; border: 1px solid #E5E5EA; background: #F9F9F9; font-size: 16px; outline: none; text-align: center; font-weight: 600; transition: 0.3s; }
        .auth-input:focus { border-color: var(--ios-blue); background: white; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        /* Header */
        .header { 
            background: linear-gradient(135deg, #FF3B30 0%, #AF52DE 100%); 
            color: white; padding: calc(50px + env(safe-area-inset-top)) 20px 50px; 
            text-align: center; border-radius: 0 0 40px 40px; position: relative;
            box-shadow: 0 10px 30px rgba(255,59,48,0.2);
        }
        .logout-btn { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 25px; color: white; font-size: 22px; opacity: 0.9; }
        
        /* Clock Card */
        .time-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            margin: -40px 20px 20px; padding: 30px; border-radius: 28px; 
            box-shadow: var(--card-shadow); text-align: center; position: relative; z-index: 10; 
        }
        .clock { font-size: 52px; font-weight: 800; color: #1c1c1e; margin: 5px 0; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
        
        /* Content */
        .card { background: white; margin: 0 20px 20px; padding: 24px; border-radius: 28px; box-shadow: var(--card-shadow); }
        .btn { border: none; border-radius: 18px; padding: 18px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; cursor: pointer; }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-start { background: linear-gradient(135deg, #34C759, #28a745); color: white; box-shadow: 0 8px 20px rgba(52,199,89,0.3); }
        .btn-end { background: linear-gradient(135deg, #FF9500, #ff7b00); color: white; box-shadow: 0 8px 20px rgba(255,149,0,0.3); }
        .btn-salary { background: linear-gradient(135deg, #5856D6, #007AFF); color: white; width: 100%; margin-top: 15px; }
        .btn-secondary { background: #F2F2F7; color: var(--ios-blue); width: 100%; margin-top: 12px; }

        .lunch-box { display: flex; justify-content: space-between; align-items: center; background: #FFF9F2; padding: 16px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,149,0,0.2); }
        .switch { position: relative; width: 51px; height: 31px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #E5E5EA; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Calendar UI */
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; font-size: 14px; background: #F2F2F7; position: relative; font-weight: 500; }
        .cal-day.has-data { background: #E8F5E9; color: var(--ios-green); font-weight: 800; }
        .cal-day.today { background: var(--ios-blue); color: white; }
        .cal-day.sunday { color: var(--ios-red); }

        /* Footer Info */
        .footer-info { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.8); backdrop-filter: blur(15px);
            padding: calc(10px + env(safe-area-inset-bottom)) 20px env(safe-area-inset-bottom);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: #8E8E93; border-top: 0.5px solid #D1D1D6; z-index: 50;
        }
        .user-tag { display: flex; align-items: center; gap: 5px; color: var(--ios-blue); font-weight: 700; text-transform: uppercase; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-content { background: white; width: 92%; border-radius: 32px; padding: 25px; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        
        #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.85); color: white; padding: 14px 28px; border-radius: 30px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20000; text-align: center; font-weight: 600; width: max-content; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="loading"><i class="fas fa-spinner fa-spin fa-3x" style="color: var(--ios-blue)"></i></div>

<div id="authScreen">
    <div class="auth-card">
        <div style="background: var(--ios-red); width: 80px; height: 80px; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(255,59,48,0.3);">
            <i class="fas fa-clock-rotate-left fa-3x" style="color: white;"></i>
        </div>
        <h2 style="font-weight: 800; letter-spacing: -1px; margin-bottom: 5px;">OT PRO PREMIUM</h2>
        <p style="color: #8E8E93; font-size: 14px; margin-bottom: 30px;">Vui lòng đăng nhập để tiếp tục</p>
        
        <input type="text" id="username" class="auth-input" placeholder="Tên đăng nhập">
        <input type="password" id="password" class="auth-input" placeholder="Mật khẩu">
        
        <div style="display: flex; gap: 12px; margin-top: 15px;">
            <button class="btn btn-start" style="flex: 2" onclick="handleAuth('login')">Đăng nhập</button>
            <button class="btn btn-secondary" style="flex: 1; margin: 0" onclick="handleAuth('register')">Đăng ký</button>
        </div>
    </div>
</div>

<div class="header">
    <h1 style="font-weight: 800; letter-spacing: -1px; font-size: 24px;">LỊCH TĂNG CA</h1>
    <i class="fas fa-power-off logout-btn" onclick="logout()"></i>
</div>

<div class="time-card">
    <div id="currentDate" style="color: #8E8E93; font-size: 15px; font-weight: 600;">--/--/----</div>
    <div class="clock" id="currentTime">00:00:00</div>
    <div id="workStatus" style="font-size: 13px; font-weight: 700; color: var(--ios-blue); background: #F2F2F7; display: inline-block; padding: 6px 15px; border-radius: 20px; margin-top: 10px;">Đang tải...</div>
</div>

<div class="card">
    <div class="lunch-box">
        <div id="lunchLabelMain" style="font-weight: 700; color: var(--ios-orange); font-size: 14px;"><i class="fas fa-utensils"></i> Tăng ca trưa (+1h)</div>
        <label class="switch"><input type="checkbox" id="lunchCheckMain"><span class="slider"></span></label>
    </div>

    <div style="display:flex; gap:15px;">
        <button class="btn btn-start" id="startBtn" style="flex: 1.2;"><i class="fas fa-play"></i> Vào ca</button>
        <button class="btn btn-end" id="endBtn" disabled style="flex: 1;"><i class="fas fa-stop"></i> Tan ca</button>
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top: 20px;">
        <div style="background:#F9F9FB; padding:18px; border-radius:22px; text-align:center; border: 1px solid #EEE;">
            <p style="font-size:11px; font-weight: 700; color:#8E8E93; margin-bottom:5px;">TỔNG THÁNG</p>
            <b id="monthlyOT" style="font-size:24px; color: #1c1c1e;">0h</b>
        </div>
        <div style="background:#F9F9FB; padding:18px; border-radius:22px; text-align:center; border: 1px solid #EEE;">
            <p style="font-size:11px; font-weight: 700; color:#8E8E93; margin-bottom:5px;">HÔM NAY</p>
            <b id="todayOTDisp" style="font-size:24px; color:var(--ios-red);">0h</b>
        </div>
    </div>

    <button class="btn btn-salary" onclick="openSalaryModal()"><i class="fas fa-sack-dollar"></i> Tính lương dự kiến</button>
    <button class="btn btn-secondary" onclick="openCalendar()"><i class="fas fa-calendar-week"></i> Xem lịch sử chi tiết</button>
</div>

<div class="footer-info">
    <div class="user-tag" id="footerUser"><i class="fas fa-circle-user"></i> <span>GUEST</span></div>
    <div style="font-weight: 600;">VERSION v3.2.0 - STABLE</div>
</div>

<div class="modal" id="calendarModal">
    <div class="modal-content">
        <div class="cal-nav">
            <i class="fas fa-chevron-left" onclick="changeMonth(-1)" style="padding:15px; color: var(--ios-blue);"></i>
            <h3 id="calMonthYear" style="font-weight:800; font-size: 18px;">Tháng --/----</h3>
            <i class="fas fa-chevron-right" onclick="changeMonth(1)" style="padding:15px; color: var(--ios-blue);"></i>
        </div>
        <div class="cal-grid"><div class="cal-head">T2</div><div class="cal-head">T3</div><div class="cal-head">T4</div><div class="cal-head">T5</div><div class="cal-head">T6</div><div class="cal-head">T7</div><div class="cal-head" style="color:var(--ios-red)">CN</div></div>
        <div class="cal-grid" id="calendarDays" style="margin-top:10px;"></div>
        
        <div id="editPanel" style="display:none; border-top:1px solid #F2F2F7; margin-top:25px; padding-top:20px;">
            <p id="editDateLabel" style="text-align:center; font-weight:800; color:var(--ios-blue); margin-bottom:15px; font-size: 16px;"></p>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px;">
                <div style="text-align: center;">
                    <label style="font-size: 10px; font-weight: 700; color: #888;">GIỜ VÀO</label>
                    <input type="time" id="editIn" style="width:100%; padding:14px; border-radius:14px; border:1px solid #E5E5EA; background:#F9F9F9; font-weight: 800; text-align: center;"> 
                </div>
                <div style="text-align: center;">
                    <label style="font-size: 10px; font-weight: 700; color: #888;">GIỜ RA</label>
                    <input type="time" id="editOut" style="width:100%; padding:14px; border-radius:14px; border:1px solid #E5E5EA; background:#F9F9F9; font-weight: 800; text-align: center;">
                </div>
            </div>
            <div class="lunch-box" style="border-style: solid; margin-bottom: 10px;">
                <div id="lunchLabelEdit" style="font-size:13px; font-weight:700;">Tăng ca trưa (+1h)</div>
                <label class="switch"><input type="checkbox" id="lunchCheckEdit"><span class="slider"></span></label>
            </div>
            <input type="number" id="editOT" step="0.1" style="width:100%; padding:15px; border-radius:18px; border:none; background:#FFF1F0; color:var(--ios-red); font-size:28px; font-weight:800; text-align:center;">
            
            <button class="btn btn-start" style="width:100%; margin-top:20px;" id="saveBtn">Cập nhật dữ liệu</button>
            <button class="btn btn-secondary" style="background:#FFE5E5; color:var(--ios-red); border:none;" id="deleteBtn">Xóa ngày này</button>
        </div>
        <button class="btn btn-secondary" onclick="closeModal('calendarModal')" style="margin-top:15px; background: none;">Đóng cửa sổ</button>
    </div>
</div>

<div class="modal" id="salaryModal">
    <div class="modal-content">
        <div class="cal-nav">
            <i class="fas fa-chevron-left" onclick="changeSalaryMonth(-1)" style="padding:15px; color: var(--ios-blue);"></i>
            <h3 id="salaryMonthYear" style="font-weight:800;">Tháng --/----</h3>
            <i class="fas fa-chevron-right" onclick="changeSalaryMonth(1)" style="padding:15px; color: var(--ios-blue);"></i>
        </div>
        <div style="text-align: center; margin-bottom: 20px;">
            <label style="font-size:11px; font-weight:700; color:#888;">LƯƠNG CƠ BẢN (VNĐ)</label>
            <input type="number" id="baseSalaryInput" oninput="updateSalaryDisplay()" style="width:100%; padding:16px; border-radius:16px; border:1px solid #E5E5EA; background:#F9F9F9; font-weight:800; text-align:center; font-size: 20px;">
        </div>
        <div style="background:linear-gradient(135deg, #F2F2F7, #FFFFFF); padding:25px; border-radius:28px; text-align:center; border: 1px solid #E5E5EA;">
            <p style="color:#8E8E93; font-size:14px; font-weight: 500;">Tổng OT: <b id="salaryOTHours" style="color:var(--ios-blue);">0h</b></p>
            <div style="height: 1px; background: #E5E5EA; margin: 15px 0;"></div>
            <p style="color:#8E8E93; font-size:12px; margin-bottom:5px; font-weight: 700;">TIỀN TĂNG CA DỰ KIẾN (x2.0)</p>
            <b id="otMoneyDetail" style="font-size:34px; color:var(--ios-red); letter-spacing: -1px;">0đ</b>
        </div>
        <button class="btn btn-salary" onclick="closeModal('salaryModal')" style="margin-top:25px;">Xong</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const SB_URL = 'https://dtdknettwfgilklaqeae.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0ZGtuZXR0d2ZnaWxrbGFxZWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NzEzMTgsImV4cCI6MjA5MDI0NzMxOH0.qDvvZHNyNPh4QxpD6fDkR4Jr1xUnLSzCm79bsKI6ILk';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    
    let currentUser = localStorage.getItem('ot_user') || null;
    let workData = [], currentViewDate = new Date(), salaryViewDate = new Date();

    if (currentUser) {
        document.getElementById('authScreen').style.display = 'none';
        document.querySelector('#footerUser span').innerText = currentUser;
        loadData();
    }

    async function handleAuth(type) {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        if (!user || !pass) return showToast("⚠️ Vui lòng nhập đủ!");
        document.getElementById('loading').style.display = 'flex';
        if (type === 'register') {
            const { error } = await supabaseClient.from('users').insert({ username: user, password: pass });
            if (error) showToast("❌ Tên này đã tồn tại!");
            else showToast("✅ Đăng ký thành công!");
        } else {
            const { data } = await supabaseClient.from('users').select('*').eq('username', user).eq('password', pass).single();
            if (data) {
                currentUser = user;
                localStorage.setItem('ot_user', user);
                document.getElementById('authScreen').style.display = 'none';
                document.querySelector('#footerUser span').innerText = currentUser;
                loadData();
            } else { showToast("❌ Sai tài khoản/mật khẩu!"); }
        }
        document.getElementById('loading').style.display = 'none';
    }

    function logout() { localStorage.removeItem('ot_user'); location.reload(); }
    function isSunday(dateStr) { return new Date(dateStr).getDay() === 0; }

    function calculateOT(inT, outT, isL, dateStr) {
        if (!inT || !outT) return 0;
        const d = "2024-01-01";
        const actS = new Date(`${d}T${inT}:00`), actE = new Date(`${d}T${outT}:00`);
        let diff = (actE - actS) / 60000;
        if (diff < 0) diff += 1440; 
        if (!isSunday(dateStr)) {
            const limitS = new Date(`${d}T07:45:00`), limitE = new Date(`${d}T17:00:00`);
            let mins = 0;
            if (actS < limitS) mins += (limitS - actS) / 60000;
            if (actE > limitE) mins += (actE - limitE) / 60000;
            return parseFloat((mins / 60 + (isL ? 1 : 0)).toFixed(2));
        } else {
            let netMins = diff - (isL ? 60 : 0); 
            return parseFloat((Math.max(0, netMins) / 60).toFixed(2));
        }
    }

    async function loadData() {
        if (!currentUser) return;
        document.getElementById('loading').style.display = 'flex';
        const { data } = await supabaseClient.from('work_logs').select('*').eq('username', currentUser).order('work_date', { ascending: false });
        workData = data || [];
        updateSummary();
        document.getElementById('loading').style.display = 'none';
    }

    function updateSummary() {
        const now = new Date(), todayStr = now.toLocaleDateString('en-CA'), thisMonthStr = now.getFullYear() + '-' + (now.getMonth() + 1).toString().padStart(2, '0');
        const monthlyOT = workData.filter(r => r.work_date.startsWith(thisMonthStr)).reduce((sum, r) => sum + (parseFloat(r.overtime) || 0), 0);
        document.getElementById('monthlyOT').innerText = monthlyOT.toFixed(1) + 'h';
        const todayRec = workData.find(r => r.work_date === todayStr);
        document.getElementById('todayOTDisp').innerText = (todayRec?.overtime || 0) + 'h';
        document.getElementById('startBtn').disabled = !!todayRec;
        document.getElementById('endBtn').disabled = (todayRec && todayRec.end_time);
        document.getElementById('workStatus').innerText = todayRec ? (todayRec.end_time ? "ĐÃ TAN CA ✅" : "ĐANG LÀM VIỆC...") : "CHƯA VÀO CA (Mặc định 07:45)";
        const label = document.getElementById('lunchLabelMain');
        if (now.getDay() === 0) label.innerHTML = '<i class="fas fa-coffee"></i> Có nghỉ trưa 1h (Trừ vào OT)';
        else label.innerHTML = '<i class="fas fa-utensils"></i> Tăng ca trưa (+1h)';
    }

    document.getElementById('startBtn').onclick = async () => {
        const now = new Date();
        const t = now.toLocaleTimeString('vi-VN', { hour12: false, hour: '2-digit', minute: '2-digit' });
        document.getElementById('loading').style.display = 'flex';
        await supabaseClient.from('work_logs').upsert({ work_date: now.toLocaleDateString('en-CA'), start_time: t, username: currentUser });
        await loadData(); 
        showToast("🚩 Đã vào ca lúc: " + t);
        document.getElementById('loading').style.display = 'none';
    };

    document.getElementById('endBtn').onclick = async () => {
        const now = new Date();
        const tOut = now.toLocaleTimeString('vi-VN', { hour12: false, hour: '2-digit', minute: '2-digit' });
        const todayStr = now.toLocaleDateString('en-CA');
        let rec = workData.find(r => r.work_date === todayStr);
        let tIn = rec?.start_time || "07:45"; 
        const ot = calculateOT(tIn, tOut, document.getElementById('lunchCheckMain').checked, todayStr);
        document.getElementById('loading').style.display = 'flex';
        await supabaseClient.from('work_logs').upsert({ work_date: todayStr, start_time: tIn, end_time: tOut, overtime: ot, username: currentUser });
        await loadData(); 
        showToast(`🏁 Tan ca: ${tOut}`);
        document.getElementById('loading').style.display = 'none';
    };

    function renderCalendar() {
        const grid = document.getElementById('calendarDays'); grid.innerHTML = '';
        const y = currentViewDate.getFullYear(), m = currentViewDate.getMonth();
        document.getElementById('calMonthYear').innerText = `Tháng ${m + 1}/${y}`;
        const firstDay = new Date(y, m, 1).getDay(), emptySlots = firstDay === 0 ? 6 : firstDay - 1, daysInMonth = new Date(y, m + 1, 0).getDate();
        for (let i = 0; i < emptySlots; i++) grid.appendChild(document.createElement('div'));
        for (let d = 1; d <= daysInMonth; d++) {
            const dStr = `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`, rec = workData.find(r => r.work_date === dStr);
            const el = document.createElement('div');
            el.className = `cal-day ${rec ? 'has-data' : ''} ${dStr === new Date().toLocaleDateString('en-CA') ? 'today' : ''} ${isSunday(dStr) ? 'sunday' : ''}`;
            el.innerHTML = `<span>${d}</span>${rec ? `<small style="font-size:9px;position:absolute;bottom:2px;">+${rec.overtime}</small>` : ''}`;
            el.onclick = () => showEdit(dStr, rec);
            grid.appendChild(el);
        }
    }

    function showEdit(date, rec) {
        document.getElementById('editPanel').style.display = 'block';
        document.getElementById('editDateLabel').innerText = "Chỉnh sửa ngày " + date.split('-').reverse().join('/');
        const inI = document.getElementById('editIn'), outI = document.getElementById('editOut'), lI = document.getElementById('lunchCheckEdit'), otI = document.getElementById('editOT');
        document.getElementById('lunchLabelEdit').innerText = isSunday(date) ? "Nghỉ trưa 1h (Trừ OT)" : "Tăng ca trưa (+1h)";
        inI.value = rec?.start_time || "07:45"; 
        outI.value = rec?.end_time || "17:00"; 
        otI.value = rec?.overtime || 0; 
        const autoCalcEdit = () => { otI.value = calculateOT(inI.value, outI.value, lI.checked, date); };
        inI.oninput = autoCalcEdit; outI.oninput = autoCalcEdit; lI.onchange = autoCalcEdit;
        document.getElementById('saveBtn').onclick = async () => {
            await supabaseClient.from('work_logs').upsert({ work_date: date, start_time: inI.value, end_time: outI.value, overtime: parseFloat(otI.value), username: currentUser });
            showToast("💾 Đã cập nhật!"); loadData(); renderCalendar();
        };
        document.getElementById('deleteBtn').onclick = async () => {
            if(confirm("Bạn muốn xóa dữ liệu ngày này?")) { 
                await supabaseClient.from('work_logs').delete().eq('work_date', date).eq('username', currentUser); 
                loadData(); renderCalendar(); document.getElementById('editPanel').style.display = 'none'; 
            }
        };
    }

    function updateSalaryDisplay() {
        const y = salaryViewDate.getFullYear(), m = salaryViewDate.getMonth();
        const monthStr = `${y}-${(m+1).toString().padStart(2,'0')}`;
        document.getElementById('salaryMonthYear').innerText = `Tháng ${m + 1}/${y}`;
        const totalOT = workData.filter(r => r.work_date.startsWith(monthStr)).reduce((sum, r) => sum + (parseFloat(r.overtime) || 0), 0);
        const base = parseFloat(document.getElementById('baseSalaryInput').value) || parseFloat(localStorage.getItem('salary_' + currentUser)) || 0;
        localStorage.setItem('salary_' + currentUser, base);
        const money = ((base / 26) / 8) * 2 * totalOT; 
        document.getElementById('salaryOTHours').innerText = totalOT.toFixed(1) + 'h';
        document.getElementById('otMoneyDetail').innerText = new Intl.NumberFormat('vi-VN').format(Math.round(money)) + "đ";
    }

    function changeMonth(dir) { currentViewDate.setMonth(currentViewDate.getMonth() + dir); renderCalendar(); }
    function changeSalaryMonth(dir) { salaryViewDate.setMonth(salaryViewDate.getMonth() + dir); updateSalaryDisplay(); }
    function openCalendar() { renderCalendar(); document.getElementById('calendarModal').style.display = 'flex'; }
    function openSalaryModal() { 
        salaryViewDate = new Date(); 
        document.getElementById('baseSalaryInput').value = localStorage.getItem('salary_' + currentUser) || "";
        updateSalaryDisplay(); 
        document.getElementById('salaryModal').style.display = 'flex'; 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    setInterval(() => {
        const now = new Date();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString('vi-VN', {hour12:false});
        document.getElementById('currentDate').innerText = now.toLocaleDateString('vi-VN', {weekday:'long', day:'numeric', month:'numeric'}).toUpperCase();
    }, 1000);
</script>
</body>
</html>
