<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⏱️ OT Pro - Premium V3.3.6</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --ios-red: #FF3B30; --ios-green: #34C759; --ios-blue: #007AFF; 
            --ios-orange: #FF9500; --ios-bg: #F2F2F7; --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { overflow-x: hidden; width: 100%; position: relative; -webkit-overflow-scrolling: touch; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--ios-bg); color: #1C1C1E; 
            padding-bottom: calc(100px + env(safe-area-inset-bottom)); 
        }
        
        /* Đăng nhập */
        #authScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #F2F2F7 0%, #E5E5EA 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 380px; padding: 40px 30px; border-radius: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .auth-input { width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 16px; border: 1px solid #E5E5EA; background: #F9F9F9; font-size: 16px; outline: none; text-align: center; font-weight: 600; }
        
        /* Header */
        .header { 
            background: linear-gradient(135deg, #FF3B30 0%, #AF52DE 100%); 
            color: white; padding: calc(50px + env(safe-area-inset-top)) 20px 50px; 
            text-align: center; border-radius: 0 0 40px 40px; position: relative;
        }
        .logout-btn { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 25px; color: white; font-size: 22px; cursor: pointer; }
        
        /* Clock Card */
        .time-card { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            margin: -40px 20px 20px; padding: 30px; border-radius: 28px; 
            box-shadow: var(--card-shadow); text-align: center; position: relative; z-index: 10; 
        }
        .clock { font-size: 52px; font-weight: 800; color: #1c1c1e; margin: 5px 0; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
        
        /* Buttons & Cards */
        .card { background: white; margin: 0 20px 20px; padding: 24px; border-radius: 28px; box-shadow: var(--card-shadow); }
        .btn { border: none; border-radius: 18px; padding: 18px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-start { background: #34C759; color: white; }
        .btn-end { background: #FF9500; color: white; }
        .btn-salary { background: #007AFF; color: white; width: 100%; margin-top: 15px; }
        .btn-secondary { background: #F2F2F7; color: var(--ios-blue); width: 100%; margin-top: 12px; }

        .lunch-box { display: flex; justify-content: space-between; align-items: center; background: #FFF9F2; padding: 16px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,149,0,0.1); }
        .switch { position: relative; width: 51px; height: 31px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #E5E5EA; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Calendar & Modals */
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; width: 100%; }
        .cal-day { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-size: 13px; background: #F2F2F7; position: relative; }
        .cal-day.has-data { background: #E8F5E9; color: var(--ios-green); font-weight: 800; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); overflow: hidden; }
        .modal-content { background: white; width: 92%; max-width: 450px; border-radius: 32px; padding: 25px; max-height: 85vh; overflow-y: auto; overflow-x: hidden; }

        /* FOOTER INFO */
        .footer-info { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 12px 20px calc(15px + env(safe-area-inset-bottom));
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: #8E8E93; border-top: 0.5px solid #D1D1D6; z-index: 50;
        }

        .toast { 
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(110px + env(safe-area-inset-bottom)); 
            background: rgba(0,0,0,0.95); color: white; padding: 14px 28px; border-radius: 30px; 
            transition: 0.4s ease; z-index: 20000; text-align: center; font-weight: 600; width: max-content; 
            max-width: 85%; opacity: 0; visibility: hidden; pointer-events: none;
        }
        .toast.show { opacity: 1; visibility: visible; bottom: calc(120px + env(safe-area-inset-bottom)); }

        #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; }
    </style>
</head>
<body>

<div id="loading"><i class="fas fa-spinner fa-spin fa-3x" style="color: var(--ios-blue)"></i></div>

<div id="authScreen">
    <div class="auth-card">
        <h2 style="font-weight: 800; margin-bottom: 20px;">HỆ THỐNG OT</h2>
        <input type="text" id="username" class="auth-input" placeholder="Tên đăng nhập">
        <input type="password" id="password" class="auth-input" placeholder="Mật khẩu">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-start" style="flex: 2" onclick="handleAuth('login')">Đăng nhập</button>
            <button class="btn btn-secondary" style="flex: 1; margin:0" onclick="handleAuth('register')">Đăng ký</button>
        </div>
    </div>
</div>

<div class="header">
    <h1 style="font-weight: 800; font-size: 20px;">CHẤM CÔNG V3.6</h1>
    <i class="fas fa-power-off logout-btn" onclick="logout()"></i>
</div>

<div class="time-card">
    <div id="currentDate" style="color: #8E8E93; font-size: 13px; font-weight: 700;">--/--/----</div>
    <div class="clock" id="currentTime">00:00:00</div>
    <div id="workStatus" style="font-size: 11px; font-weight: 700; color: var(--ios-blue); background: #F2F2F7; padding: 4px 12px; border-radius: 12px; display: inline-block;">Đang đồng bộ...</div>
</div>

<div class="card">
    <div class="lunch-box">
        <div id="lunchLabelMain" style="font-weight: 700; color: var(--ios-orange); font-size: 13px;">Tăng ca trưa (+1h)</div>
        <label class="switch"><input type="checkbox" id="lunchCheckMain"><span class="slider"></span></label>
    </div>

    <div style="display:flex; gap:12px;">
        <button class="btn btn-start" id="startBtn" style="flex: 1.2;"><i class="fas fa-play"></i> Vào ca</button>
        <button class="btn btn-end" id="endBtn" style="flex: 1;"><i class="fas fa-stop"></i> Tan ca</button>
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top: 15px;">
        <div style="background:#F9F9FB; padding:15px; border-radius:20px; text-align:center;">
            <p style="font-size:10px; font-weight: 700; color:#8E8E93;">THÁNG NÀY</p>
            <b id="monthlyOT" style="font-size:22px;">0h</b>
        </div>
        <div style="background:#F9F9FB; padding:15px; border-radius:20px; text-align:center;">
            <p style="font-size:10px; font-weight: 700; color:#8E8E93;">HÔM NAY</p>
            <b id="todayOTDisp" style="font-size:22px; color:var(--ios-red);">0h</b>
        </div>
    </div>

    <button class="btn btn-salary" onclick="openSalaryModal()"><i class="fas fa-coins"></i> Ước tính lương</button>
    <button class="btn btn-secondary" onclick="openCalendar()"><i class="fas fa-history"></i> Lịch sử làm việc</button>
</div>

<div class="footer-info">
    <div style="color: var(--ios-blue); font-weight: 800;"><i class="fas fa-user-circle"></i> <span id="footerUser">GUEST</span></div>
    <div style="font-weight: 600; opacity: 0.6;">V3.3.6 - FIX LOGIC</div>
</div>

<div class="modal" id="calendarModal">
    <div class="modal-content">
        <div class="cal-nav">
            <i class="fas fa-chevron-left" onclick="changeMonth(-1)" style="padding:15px; color: var(--ios-blue);"></i>
            <h3 id="calMonthYear" style="font-weight:800;">Tháng --/----</h3>
            <i class="fas fa-chevron-right" onclick="changeMonth(1)" style="padding:15px; color: var(--ios-blue);"></i>
        </div>
        <div class="cal-grid" id="calendarDays"></div>
        <div id="editPanel" style="display:none; border-top:1px solid #EEE; margin-top:20px; padding-top:20px;">
            <p id="editDateLabel" style="text-align:center; font-weight:800; color:var(--ios-blue); margin-bottom:15px;"></p>
            
            <div class="lunch-box" style="margin-bottom:15px; background: #F2F2F7; padding:10px 15px;">
                <div id="editLunchLabel" style="font-weight: 700; color: var(--ios-orange); font-size: 12px;">Tăng ca trưa (+1h)</div>
                <label class="switch"><input type="checkbox" id="editLunchCheck"><span class="slider"></span></label>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                <input type="time" id="editIn" class="auth-input" style="padding:12px; margin:0"> 
                <input type="time" id="editOut" class="auth-input" style="padding:12px; margin:0">
            </div>
            <button class="btn btn-start" style="width:100%; margin-top:5px;" id="saveBtn">Lưu cập nhật</button>
            <button class="btn btn-secondary" style="background:#FFE5E5; color:var(--ios-red);" id="deleteBtn">Xóa ngày này</button>
        </div>
        <button class="btn btn-secondary" onclick="closeModal('calendarModal')" style="margin-top:15px; background: none;">Đóng</button>
    </div>
</div>

<div class="modal" id="salaryModal">
    <div class="modal-content">
        <h3 id="salaryMonthYear" style="text-align:center; font-weight:800; margin-bottom:20px;">Tháng --/----</h3>
        <input type="number" id="baseSalaryInput" oninput="updateSalaryDisplay()" placeholder="Lương cơ bản..." class="auth-input">
        <div style="background:#F2F2F7; padding:25px; border-radius:24px; text-align:center;">
            <p style="font-size:11px; font-weight: 700; color: #888;">TIỀN OT TẠM TÍNH (X2.0)</p>
            <b id="otMoneyDetail" style="font-size:32px; color:var(--ios-red);">0đ</b>
        </div>
        <button class="btn btn-salary" onclick="closeModal('salaryModal')" style="margin-top:20px;">Xong</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const SB_URL = 'https://dtdknettwfgilklaqeae.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0ZGtuZXR0d2ZnaWxrbGFxZWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NzEzMTgsImV4cCI6MjA5MDI0NzMxOH0.qDvvZHNyNPh4QxpD6fDkR4Jr1xUnLSzCm79bsKI6ILk';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = localStorage.getItem('ot_user') || null, workData = [], currentViewDate = new Date();

    if (currentUser) { document.getElementById('authScreen').style.display = 'none'; document.getElementById('footerUser').innerText = currentUser.toUpperCase(); loadData(); }

    async function handleAuth(type) {
        const u = document.getElementById('username').value.trim(), p = document.getElementById('password').value.trim();
        if(!u || !p) return showToast("Nhập đủ thông tin!");
        document.getElementById('loading').style.display = 'flex';
        if(type === 'register') {
            const { error } = await supabaseClient.from('users').insert({ username: u, password: p });
            error ? showToast("Tài khoản đã tồn tại!") : showToast("Đăng ký thành công!");
        } else {
            const { data } = await supabaseClient.from('users').select('*').eq('username', u).eq('password', p).single();
            if(data) { currentUser = u; localStorage.setItem('ot_user', u); location.reload(); } else showToast("Sai tài khoản!");
        }
        document.getElementById('loading').style.display = 'none';
    }

    function logout() { localStorage.removeItem('ot_user'); location.reload(); }

    // FIXED LOGIC OT V3.6
    function calculateOT(inT, outT, isLunch, dateStr) {
        if (!inT || !outT) return 0;
        const [hIn, mIn] = inT.split(':').map(Number), [hOut, mOut] = outT.split(':').map(Number);
        const sMins = hIn * 60 + mIn, eMins = hOut * 60 + mOut, isSun = new Date(dateStr).getDay() === 0;
        if (isSun) {
            let total = eMins - sMins;
            if (isLunch) total -= 60;
            return Math.max(0, parseFloat((total / 60).toFixed(2)));
        } else {
            const wStart = 7 * 60 + 45, wEnd = 17 * 60;
            let ot = 0;
            if (sMins < wStart) ot += (wStart - sMins);
            if (eMins > wEnd) ot += (eMins - wEnd);
            if (isLunch) ot += 60;
            return parseFloat((ot / 60).toFixed(2));
        }
    }

    async function loadData() {
        const { data } = await supabaseClient.from('work_logs').select('*').eq('username', currentUser);
        workData = data || []; updateSummary();
    }

    function updateSummary() {
        const now = new Date(), todayStr = now.toLocaleDateString('en-CA'), monthStr = todayStr.substring(0, 7);
        const monthly = workData.filter(r => r.work_date.startsWith(monthStr)).reduce((s, r) => s + (parseFloat(r.overtime) || 0), 0);
        const today = workData.find(r => r.work_date === todayStr);
        document.getElementById('monthlyOT').innerText = monthly.toFixed(1) + 'h';
        document.getElementById('todayOTDisp').innerText = (today?.overtime || 0) + 'h';
        document.getElementById('startBtn').disabled = !!today;
        document.getElementById('workStatus').innerText = today ? (today.end_time ? "ĐÃ TAN CA" : "ĐANG LÀM VIỆC...") : "CHƯA VÀO CA";
        document.getElementById('lunchLabelMain').innerText = (now.getDay() === 0) ? "Nghỉ trưa 1h (Trừ OT)" : "Tăng ca trưa (+1h)";
    }

    document.getElementById('startBtn').onclick = async () => {
        const t = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', hour12:false});
        await supabaseClient.from('work_logs').upsert({ work_date: new Date().toLocaleDateString('en-CA'), start_time: t, username: currentUser });
        showToast("🔔 Vào ca: " + t); loadData();
    };

    document.getElementById('endBtn').onclick = async () => {
        const now = new Date(), tOut = now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', hour12:false}), todayStr = now.toLocaleDateString('en-CA');
        const rec = workData.find(r => r.work_date === todayStr);
        const ot = calculateOT(rec?.start_time || "07:45", tOut, document.getElementById('lunchCheckMain').checked, todayStr);
        await supabaseClient.from('work_logs').upsert({ work_date: todayStr, start_time: rec?.start_time || "07:45", end_time: tOut, overtime: ot, username: currentUser });
        showToast("✅ Đã tan ca: " + tOut); loadData();
    };

    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openCalendar() { renderCalendar(); document.getElementById('calendarModal').style.display = 'flex'; }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays'), y = currentViewDate.getFullYear(), m = currentViewDate.getMonth();
        grid.innerHTML = ''; document.getElementById('calMonthYear').innerText = `Tháng ${m+1}/${y}`;
        const days = new Date(y, m+1, 0).getDate();
        for(let d=1; d<=days; d++) {
            const dStr = `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`, rec = workData.find(r => r.work_date === dStr);
            const el = document.createElement('div'); el.className = `cal-day ${rec?'has-data':''}`;
            el.innerHTML = `<span>${d}</span>${rec?`<small style="font-size:8px;position:absolute;bottom:2px;font-weight:700;">${rec.overtime}h</small>`:''}`;
            el.onclick = () => {
                const isSun = new Date(dStr).getDay() === 0;
                document.getElementById('editPanel').style.display='block';
                document.getElementById('editDateLabel').innerText = dStr.split('-').reverse().join('/');
                document.getElementById('editIn').value = rec?.start_time || "07:45";
                document.getElementById('editOut').value = rec?.end_time || "17:00";
                document.getElementById('editLunchLabel').innerText = isSun ? "Nghỉ trưa 1h (Trừ OT)" : "Tăng ca trưa (+1h)";
                document.getElementById('saveBtn').onclick = async () => {
                    const ot = calculateOT(document.getElementById('editIn').value, document.getElementById('editOut').value, document.getElementById('editLunchCheck').checked, dStr);
                    await supabaseClient.from('work_logs').upsert({work_date: dStr, start_time: document.getElementById('editIn').value, end_time: document.getElementById('editOut').value, overtime: ot, username: currentUser});
                    showToast("💾 Đã lưu!"); loadData(); renderCalendar();
                };
                document.getElementById('deleteBtn').onclick = async () => {
                    if(confirm("Xóa ngày này?")) { await supabaseClient.from('work_logs').delete().eq('work_date', dStr).eq('username', currentUser); loadData(); renderCalendar(); document.getElementById('editPanel').style.display='none'; }
                };
            };
            grid.appendChild(el);
        }
    }

    function updateSalaryDisplay() {
        const base = parseFloat(document.getElementById('baseSalaryInput').value) || 0;
        const mStr = new Date().toISOString().substring(0, 7), totalOT = workData.filter(r => r.work_date.startsWith(mStr)).reduce((s, r) => s + (parseFloat(r.overtime) || 0), 0);
        document.getElementById('salaryMonthYear').innerText = `Tháng ${new Date().getMonth()+1}/${new Date().getFullYear()}`;
        document.getElementById('otMoneyDetail').innerText = new Intl.NumberFormat('vi-VN').format(Math.round(((base / 26) / 8) * 2 * totalOT)) + "đ";
    }

    function changeMonth(v) { currentViewDate.setMonth(currentViewDate.getMonth() + v); renderCalendar(); }

    setInterval(() => {
        const n = new Date();
        document.getElementById('currentTime').innerText = n.toLocaleTimeString('vi-VN', {hour12:false});
        document.getElementById('currentDate').innerText = n.toLocaleDateString('vi-VN', {weekday:'long', day:'numeric', month:'numeric'}).toUpperCase();
    }, 1000);
</script>
</body>
</html>
